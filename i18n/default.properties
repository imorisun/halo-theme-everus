# ==========================================================================
# EverUs 主题 —— 默认语言包（简体中文）
# --------------------------------------------------------------------------
# Halo 在找不到与用户语言匹配的文件时回退到本文件。
#
# 为什么把中文作为 default 而不是英文：
#   本主题的现有用户基本都是中文站点。若 default 为英文，浏览器只发送
#   "zh"（无地区码）的用户会匹配不到 zh_CN 而落到 default，界面会突然
#   变成英文 —— 那是对既有站点的回归。以中文兜底可保证任何语言环境下
#   至少维持与升级前一致的观感。
#   如需繁体、日文等，另建 zh_TW.properties / ja.properties 即可。
#
# 注意：本文件为 UTF-8 无 BOM 编码。
# ==========================================================================

