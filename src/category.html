<include src="layout.html">
    <div class="archive-page archive-page--category">

      <!-- ====== Hero 头部 ====== -->
      <header class="archive-hero" th:if="${category?.spec?.displayName}" th:classappend="${not #strings.isEmpty(category?.spec?.cover)} ? 'archive-hero--thumb' : ''">
        <div class="archive-hero__inner">
          <nav class="archive-hero__breadcrumb">
            <a th:href="@{/}">首页</a>
            <span class="archive-hero__breadcrumb-sep">/</span>
            <a th:href="@{/categories}">分类</a>
            <span class="archive-hero__breadcrumb-sep">/</span>
            <span class="archive-hero__breadcrumb-cur" th:text="${category?.spec?.displayName}"></span>
          </nav>

          <h1 class="archive-hero__title">
            <span class="archive-hero__kicker">Category</span>
            <span th:text="${category?.spec?.displayName}"></span>
          </h1>

          <div class="archive-hero__meta">
            <span class="hero-badge hero-badge--accent">
              <i class="Nug Nug-wenzhang"></i>
              <span th:text="${posts?.total ?: 0}"></span>
              <span>篇文章</span>
            </span>
            <span class="hero-badge hero-badge--muted" th:if="${(posts?.totalPages ?: 0) > 1}">
              <i class="Nug Nug-riqi"></i>
              <span th:text="|第 ${posts?.page ?: 1} / ${posts?.totalPages ?: 1} 页|"></span>
            </span>
          </div>

          <div class="archive-hero__desc" th:if="${not #strings.isEmpty(category?.spec?.description)}">
            <p th:text="${category?.spec?.description}"></p>
          </div>
        </div>
        <img class="archive-hero__thumb" th:if="${not #strings.isEmpty(category?.spec?.cover)}"
             th:src="${category?.spec?.cover}" th:alt="${category?.spec?.displayName}" loading="lazy" />
      </header>

      <!-- ====== 回退 Header（无显示名时） ====== -->
      <header class="archive-hero archive-hero--minimal" th:unless="${category?.spec?.displayName}">
        <div class="archive-hero__inner">
          <h1 class="archive-hero__title">
            <span class="archive-hero__kicker">Category</span>
            <span>分类</span>
          </h1>
        </div>
      </header>

      <!-- ====== 主体：文章网格 + 侧边栏 ====== -->
      <div class="archive-body archive-body--sidebar">

        <!-- 文章卡片网格 -->
        <div class="archive-body__main">
          <th:block th:replace="~{modules/post-card-list :: post-card-list(posts=${posts}, emptyTitle='暂无文章', emptyDesc='该分类正在等待第一篇文章。')}"></th:block>
        </div>

        <!-- ====== 侧边栏 ====== -->
        <aside class="archive-sidebar" th:if="${category?.spec?.displayName}">
          <div class="archive-sidebar__card">
            <div class="archive-sidebar__stat">
              <span class="archive-sidebar__stat-num" th:text="${posts?.total ?: 0}"></span>
              <span class="archive-sidebar__stat-label">篇文章</span>
            </div>
            <div class="archive-sidebar__stat" th:if="${(posts?.totalPages ?: 0) > 1}">
              <span class="archive-sidebar__stat-num" th:text="${posts?.totalPages ?: 1}"></span>
              <span class="archive-sidebar__stat-label">页</span>
            </div>
          </div>

          <div class="archive-sidebar__card" th:if="${not #strings.isEmpty(category?.spec?.description)}">
            <h3 class="archive-sidebar__heading">关于</h3>
            <p class="archive-sidebar__text" th:text="${category.spec.description}"></p>
          </div>

          <nav class="archive-sidebar__card">
            <h3 class="archive-sidebar__heading">快捷链接</h3>
            <a th:href="@{/categories}" class="archive-sidebar__link">
              <i class="Nug Nug-wenzhang2"></i> 所有分类
            </a>
            <a th:href="@{/archives}" class="archive-sidebar__link">
              <i class="Nug Nug-riqi"></i> 归档
            </a>
            <a th:href="@{/tags}" class="archive-sidebar__link">
              <i class="Nug Nug-biaoqian"></i> 标签
            </a>
          </nav>
        </aside>
      </div>

      <!-- ====== 分页 ====== -->
      <th:block th:replace="~{modules/pagination :: pagination(posts=${posts})}"></th:block>
    </div>
</include>
