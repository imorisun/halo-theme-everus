<!doctype html>
<!-- lang 跟随访问者语言；保留静态 lang 作为构建期/无 Thymeleaf 环境下的兜底 -->
<html lang="zh-CN" th:lang="${#locale.toLanguageTag()}" xmlns:th="https://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" th:content="${(theme.config?.style?.color_scheme ?: 'dark') == 'light' ? '#E9ECF0' : '#000000'}" />
    <!--
      不要在此手写 description / keywords / og:* / twitter:* / canonical。
      Halo 会在运行时针对当前页面（文章 / 分类 / 标签 / 作者…）自动注入这些标签。
      此前手写的版本全部取站点级常量，造成两个问题：
        1. 与 Halo 自动注入的标签重复；
        2. 文章页被分享时显示的是站点标题与站点简介，而非该文章自身的标题与摘要。
      （og:image 之前用的是 site.favicon —— 网站图标尺寸远达不到社交卡片要求。）
    -->

    <!--
      第三方库（GSAP / ScrollTrigger / Fancybox）已改为 npm 依赖 + Vite 打包自托管，
      见 src/js/vendor.js。因此这里不再需要任何 preconnect：
      整个页面已无第三方运行时请求。
    -->

    <th:block th:if="${#strings.isEmpty(site.favicon)}">
      <link rel="shortcut icon" th:href="@{/assets/images/logo.svg}" />
      <link rel="bookmark" th:href="@{/assets/images/logo.svg}" />
      <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/avatar.jpg}" />
    </th:block>
    <th:block th:unless="${#strings.isEmpty(site.favicon)}">
      <link rel="shortcut icon" th:href="${site.favicon}" />
      <link rel="bookmark" th:href="${site.favicon}" />
      <link rel="apple-touch-icon" sizes="180x180" th:href="${site.favicon}" />
    </th:block>

    <!-- 页面标题：各页面用 <template name="title"> 覆盖，未覆盖时回退为站点名 -->
    <slot name="title">
      <title th:text="${site.title}"></title>
    </slot>

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/assets/css/icon.css?v={v}(v=${theme.spec.version})}" />
    <link rel="stylesheet" th:if="${not #strings.isEmpty(theme.config?.music?.custom_playlist) or not #strings.isEmpty(theme.config?.music?.music_id)}" th:href="@{/assets/js/aplayer/APlayer.min.css?v={v}(v=${theme.spec.version})}" />
    <link rel="stylesheet" th:href="@{/assets/css/style.css?v={v}(v=${theme.spec.version})}" />
    <!-- Fancybox 的样式由 src/js/vendor.js 通过 import 引入，Vite 会自动注入对应的 <link> -->

    <!-- 主题色：仅覆盖主色及衍生变量，其余设计令牌保持默认 -->
    <th:block th:if="${not #strings.isEmpty(theme.config?.style?.accent_color)}">
      <style th:inline="text">
        :root {
          --color-primary: [[${theme.config.style.accent_color}]];
          --color-primary-hover: color-mix(in srgb, [[${theme.config.style.accent_color}]] 80%, #ffffff);
          --color-primary-alpha-sm: color-mix(in srgb, [[${theme.config.style.accent_color}]] 6%, transparent);
          --color-primary-alpha: color-mix(in srgb, [[${theme.config.style.accent_color}]] 10%, transparent);
          --color-primary-alpha-md: color-mix(in srgb, [[${theme.config.style.accent_color}]] 18%, transparent);
          --color-primary-alpha-lg: color-mix(in srgb, [[${theme.config.style.accent_color}]] 25%, transparent);
          --color-primary-alpha-xl: color-mix(in srgb, [[${theme.config.style.accent_color}]] 30%, transparent);
          --halo-cw-primary-2-color: color-mix(in srgb, [[${theme.config.style.accent_color}]] 70%, transparent);
          --halo-cw-primary-3-color: color-mix(in srgb, [[${theme.config.style.accent_color}]] 20%, transparent);
        }
      </style>
    </th:block>

    <!-- Custom font -->
    <th:block th:if="${theme.config.style.custom_font}">
      <style th:inline="text">
        @font-face {
          font-family: 'wodeziti';
          font-weight: 400;
          font-style: normal;
          font-display: swap;
          src: url('[[${theme.config.style.custom_font}]]');
        }
        body {
          font-family: 'wodeziti';
          font-weight: 400;
        }
      </style>
    </th:block>

    <!-- 自定义 CSS：追加在主题样式之后，可覆盖默认样式 -->
    <th:block th:if="${not #strings.isEmpty(theme.config?.style?.custom_css)}">
      <style th:inline="text">[[${theme.config.style.custom_css}]]</style>
    </th:block>

    <!-- 页面自定义 head 内容（通过 <template name="head"> 注入） -->
    <slot name="head"></slot>

    <!-- 自定义 head 代码（统计代码、验证 meta 标签等） -->
    <th:block th:utext="${theme.config?.global?.head_code}"></th:block>
  </head>

  <!-- 配色方案：dark 暗色（默认）/ light 亮色，由主题设置切换 -->
  <body th:class="${(theme.config?.style?.color_scheme ?: 'dark') == 'light' ? 'light' : 'dark'}">
    <!-- 粒子背景（跟随主题色，位于所有内容之下） -->
    <canvas id="everus-particles" class="particles-canvas" aria-hidden="true"
            th:if="${theme.config?.global?.particles_enabled ?: false}"
            th:attr="data-count=${theme.config?.global?.particles_count ?: 60}"></canvas>

    <!-- 阅读进度条 -->
    <div class="reading-progress" aria-hidden="true" th:if="${theme.config?.global?.show_reading_progress ?: true}">
      <div class="reading-progress__bar" id="reading-progress-bar"></div>
    </div>

    <!-- Navigation -->
    <div th:with="menu = ${menuFinder.getPrimary()}">
      <div class="site-nav">
        <div class="site-nav__inner">
          <nav class="site-nav__menu" role="navigation">
            <ul class="site-nav__dropdown site-nav__dropdown--cat" id="site-nav-menu">
              <li class="site-nav__dropdown-item">
                <a class="site-nav__dropdown-link" th:href="@{/}" th:text="#{common.home}">首页</a>
              </li>
              <th:block th:if="${menu != null}">
                <li class="site-nav__dropdown-item" th:each="item : ${menu.menuItems}"
                    th:classappend="${item.children != null and not item.children.isEmpty()} ? 'has-children' : ''">
                  <a th:href="${#strings.isEmpty(item?.status?.href) ? null : item?.status?.href}"
                     class="site-nav__dropdown-link"
                     th:text="${item?.status?.displayName}"
                     th:aria-haspopup="${item.children != null and not item.children.isEmpty() ? 'true' : 'false'}"
                     th:aria-expanded="${item.children != null and not item.children.isEmpty() ? 'false' : null}"></a>
                  <ul class="site-nav__submenu" th:if="${item.children != null and not item.children.isEmpty()}" role="menu">
                    <li class="site-nav__submenu-item" th:each="child : ${item.children}" role="none">
                      <a th:href="${#strings.isEmpty(child?.status?.href) ? null : child?.status?.href}"
                         class="site-nav__submenu-link"
                         th:text="${child?.status?.displayName}"
                         role="menuitem"></a>
                    </li>
                  </ul>
                </li>
              </th:block>
            </ul>
            <button class="daohang" type="button" th:aria-label="#{a11y.menuToggle}" aria-expanded="false" aria-controls="site-nav-menu">
              <i class="Nug Nug-daohang" aria-hidden="true"></i>
            </button>
          </nav>

          <div class="site-nav__actions">
            <button class="music__toggle" type="button" th:aria-label="#{a11y.musicToggle}" aria-pressed="false" th:if="${not #strings.isEmpty(theme.config?.music?.custom_playlist) or not #strings.isEmpty(theme.config?.music?.music_id)}">
              <i class="Nug Nug-yinle" aria-hidden="true"></i>
            </button>
            <button class="huojian__toggle hidden" type="button" th:aria-label="#{a11y.backToTop}">
              <i class="Nug Nug-huojian" aria-hidden="true"></i>
            </button>
            <button class="site-status__toggle" type="button" th:aria-label="#{nav.siteStatus}" th:title="#{nav.siteStatus}" aria-expanded="false" aria-controls="site-status-panel">
              <th:block th:if="${#strings.isEmpty(#authentication.name) or #authentication.name == 'anonymousUser'}">
                <th:block th:if="${not #strings.isEmpty(site.logo)}">
                  <img class="site-status__avatar" th:src="${site.logo}" alt="Avatar" />
                </th:block>
                <th:block th:unless="${not #strings.isEmpty(site.logo)}">
                  <img class="site-status__avatar" th:src="@{/assets/images/avatar.jpg}" alt="Avatar" />
                </th:block>
              </th:block>
              <th:block th:unless="${#strings.isEmpty(#authentication.name) or #authentication.name == 'anonymousUser'}" th:with="contributor=${contributorFinder.getContributor(#authentication.name)}">
                <th:block th:if="${not #strings.isEmpty(contributor.avatar)}">
                  <img class="site-status__avatar" th:src="${contributor.avatar}" th:alt="${contributor.displayName}" />
                </th:block>
                <th:block th:unless="${not #strings.isEmpty(contributor.avatar)}">
                  <img class="site-status__avatar" th:src="@{/assets/images/avatar.jpg}" th:alt="${contributor.displayName}" />
                </th:block>
              </th:block>
            </button>
          </div>
        </div>

        <!-- Site Status Panel -->
        <div class="site-status-panel" id="site-status-panel"
             th:with="stats=${siteStatsFinder.getStats()}, tagCount=${tagFinder.list(1,1).total}, pageCount=${singlePageFinder.list(1,1).total}">
          <div class="site-status-panel__header">
            <span class="site-status-panel__title" th:text="#{nav.siteStatus}">站点状态</span>
            <span class="site-status-panel__site-name" th:text="${site.title}"></span>
          </div>
          <div class="site-status-panel__body">
            <a class="site-status-panel__item site-status-panel__item--link" th:href="@{/archives}">
              <span class="site-status-panel__label" th:text="#{nav.statPosts}">文章</span>
              <span class="site-status-panel__value" th:text="${stats.post}">0</span>
            </a>
            <div class="site-status-panel__item">
              <span class="site-status-panel__label" th:text="#{nav.statComments}">评论</span>
              <span class="site-status-panel__value" th:text="${stats.comment}">0</span>
            </div>
            <a class="site-status-panel__item site-status-panel__item--link" th:href="@{/categories}">
              <span class="site-status-panel__label" th:text="#{nav.statCategories}">分类</span>
              <span class="site-status-panel__value" th:text="${stats.category}">0</span>
            </a>
            <a class="site-status-panel__item site-status-panel__item--link" th:href="@{/tags}">
              <span class="site-status-panel__label" th:text="#{nav.statTags}">标签</span>
              <span class="site-status-panel__value" th:text="${tagCount}">0</span>
            </a>
            <div class="site-status-panel__item">
              <span class="site-status-panel__label" th:text="#{nav.statPages}">页面</span>
              <span class="site-status-panel__value" th:text="${pageCount}">0</span>
            </div>
            <div class="site-status-panel__item">
              <span class="site-status-panel__label" th:text="#{nav.statUpvotes}">点赞</span>
              <span class="site-status-panel__value" th:text="${stats.upvote}">0</span>
            </div>
          </div>
          <div class="site-status-panel__footer">
            <span class="site-status-panel__visit">
              <i class="Nug Nug-yanjing"></i>
              <span th:text="#{nav.visit}">访问</span> <strong th:text="${stats.visit}">0</strong>
            </span>
            <th:block th:if="${#strings.isEmpty(#authentication.name) or #authentication.name == 'anonymousUser'}">
              <a class="site-status-panel__login" th:href="@{/console/login(redirect_uri='/console')}" data-no-pjax th:text="#{nav.login}">
                登录
              </a>
            </th:block>
            <th:block th:unless="${#strings.isEmpty(#authentication.name) or #authentication.name == 'anonymousUser'}">
              <a class="site-status-panel__login" th:href="@{/console}" data-no-pjax th:text="#{nav.console}">
                管理
              </a>
            </th:block>
          </div>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <div class="content" id="pjax-container">
      <slot />
    </div>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-content">
        <!--
          用 ?: true 而非直接取值：老站点的 configMap 里没有 show_slogan 这个键，
          取值为 null 会被判为 false，导致升级后标语凭空消失。
          写成「未显式设为 false 就显示」可保证既有站点观感不变。
        -->
        <h5 class="wuxinghongqi" th:if="${theme.config?.footer?.show_slogan ?: true}">
          <svg class="icon" style="width:2.5em;height:2em;vertical-align:middle;fill:currentColor;overflow:hidden" viewBox="0 0 1536 1024" version="1.1" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h1536.090316v1024H0z" fill="#F40002"/><path d="M254.690422 104.40501l34.139354 106.93385 112.172164-0.722526-91.038278 65.569237 35.223143 106.572587-90.496383-66.472393-90.496384 66.472393 35.223143-106.572587L108.378903 210.616334l112.172164 0.722526zM477.228435 66.111131l33.958723 14.992415 24.204622-27.997884-3.61263 36.848827 34.139354 14.450521-36.126301 7.947786-3.251367 37.029458L507.75516 117.410478l-36.126301 8.309049 24.565884-27.817251zM591.568178 160.400776l24.565884 27.817252 33.778092-15.173047-18.785677 31.971777 24.927148 27.455989-36.306932-7.947787-18.424414 32.152408-3.61263-36.848827-36.126301-7.767155 33.958723-14.811783zM612.702064 308.699241l10.83789 35.584407 37.21009 0.180631-30.346093 21.314518 11.199154 35.223143-29.623567-22.217675-30.165461 21.675781 12.10231-35.042512-29.984829-22.037044 37.21009 0.541895zM471.990122 429.180455l35.223143 11.379785 21.314518-30.346093 0.180631 37.21009 35.403775 11.018522-35.223143 11.379785 0.361263 37.21009-21.856412-29.98483-35.042512 11.741048 21.67578-29.98483z" fill="#FCEE21"/></svg>
          <span th:text="#{footer.slogan}">爱我中华</span>
        </h5>
        <div class="footer-copyright">
          <th:block th:if="${not #strings.isEmpty(theme.config?.footer?.custom_text)}"
                    th:text="${theme.config.footer.custom_text}"></th:block>
          <th:block th:unless="${not #strings.isEmpty(theme.config?.footer?.custom_text)}">
            © <span th:text="${#dates.year(#dates.createNow())}"></span>. <a class="text-link" th:href="@{/}" th:text="${site.title}"></a> | <span th:text="#{footer.tagline}">记录，即是确认我仍在场。</span>
          </th:block>
        </div>
        <!-- 站点运行时间（JS 根据成立日期渲染） -->
        <div class="footer-runtime"
             th:if="${(theme.config?.global?.show_runtime ?: false) and not #strings.isEmpty(theme.config?.global?.site_start_date)}">
          <span data-everus-runtime th:attr="data-start-date=${theme.config.global.site_start_date}"></span>
        </div>
        <a th:if="${not #strings.isEmpty(theme.config?.footer?.icp)}"
           class="footer-beian"
           href="https://beian.miit.gov.cn"
           target="_blank"
           rel="noopener"
           th:text="${theme.config.footer.icp}"></a>
        <a th:if="${not #strings.isEmpty(theme.config?.footer?.gongan)}"
           class="footer-beian"
           href="https://beian.mps.gov.cn"
           target="_blank"
           rel="noopener"
           th:text="${theme.config.footer.gongan}"></a>
      </div>
    </footer>

    <!-- 音乐播放器 — 仅在配置了歌单后加载 -->
    <div id="nav-music" class="footer-music" th:if="${not #strings.isEmpty(theme.config?.music?.custom_playlist) or not #strings.isEmpty(theme.config?.music?.music_id)}">
      <a id="nav-music-hoverTips"></a>
      <div id="aplayer-container"></div>
      <div class="mobile-lrc-display" th:if="${not #strings.isEmpty(theme.config?.music?.custom_playlist) or not #strings.isEmpty(theme.config?.music?.music_id)}">
        <span class="mobile-lrc-text"></span>
      </div>
      <button class="playlist-toggle" type="button" th:aria-label="#{a11y.playlistToggle}" aria-expanded="false" aria-controls="playlist-panel" th:if="${not #strings.isEmpty(theme.config?.music?.custom_playlist) or not #strings.isEmpty(theme.config?.music?.music_id)}">
        <span class="playlist-toggle__icon" aria-hidden="true"></span>
      </button>
      <div class="playlist-panel" id="playlist-panel">
        <div class="playlist-panel__header">
          <span th:text="#{nav.playlist}">歌单列表</span>
          <button class="playlist-panel__close" type="button" th:aria-label="#{a11y.closePlaylist}"><i class="Nug Nug-guanbi" aria-hidden="true"></i></button>
        </div>
        <ul class="playlist-panel__list"></ul>
      </div>
      <script th:inline="javascript">
        window.__MUSIC_CONFIG__ = {
          customPlaylist: /*[[${theme.config?.music?.custom_playlist}]]*/ null,
          platformId: /*[[${theme.config?.music?.music_id}]]*/ null,
          platform: /*[[${theme.config?.music?.platform ?: 'netease'}]]*/ 'netease'
        };
      </script>
    </div>

    <!-- Scripts -->
    <!--
      第三方库入口（GSAP / ScrollTrigger / Fancybox）。
      type="module" 语义等价于 defer，会在 DOMContentLoaded 之前、
      且在下面带 defer 的 main.js 之前按文档顺序执行完成。
    -->
    <!--
      注意路径写成 /js/vendor.js（相对 Vite root = src/）而非 ./js/vendor.js：
      layout.html 会被内联进所有页面入口，其中 error/error.html 位于子目录，
      用 ./ 会被解析成 src/error/js/vendor.js 而导致构建失败。
    -->
    <script type="module" src="/js/vendor.js"></script>

    <script th:if="${not #strings.isEmpty(theme.config?.music?.custom_playlist) or not #strings.isEmpty(theme.config?.music?.music_id)}" th:src="@{/assets/js/aplayer/APlayer.min.js?v={v}(v=${theme.spec.version})}"></script>
    <script th:if="${not #strings.isEmpty(theme.config?.music?.custom_playlist) or not #strings.isEmpty(theme.config?.music?.music_id)}" th:src="@{/assets/js/aplayer/Meting2.min.js?v={v}(v=${theme.spec.version})}"></script>

    <script defer th:src="@{/assets/js/main.js?v={v}(v=${theme.spec.version})}"></script>

    <!-- JS 所需界面文案（随语言包切换） -->
    <script th:inline="javascript">
      window.__EVERUS_I18N__ = {
        copyCode: /*[[#{post.copyCode}]]*/ '复制代码',
        copied: /*[[#{post.copied}]]*/ '已复制',
        wordCount: /*[[#{post.wordCount}]]*/ '字',
        readTime: /*[[#{post.readTime}]]*/ '分钟读完',
        runtimePrefix: /*[[#{footer.runtimePrefix}]]*/ '本站已运行',
        runtimeYear: /*[[#{footer.runtimeYear}]]*/ '年',
        runtimeDay: /*[[#{footer.runtimeDay}]]*/ '天'
      };
    </script>

    <halo:footer />

    <!-- 页脚自定义代码（统计脚本、客服组件等） -->
    <th:block th:utext="${theme.config?.global?.footer_code}"></th:block>
  </body>
</html>
