<include src="layout.html">
    <template name="title">
      <title th:text="|${tag?.spec?.displayName ?: #messages.msg('common.tags')} - ${site.title}|"></title>
    </template>

    <div class="archive-page archive-page--tag" th:style="|--tag-color:${tag?.spec?.color ?: '#26a760'}|">

      <!-- ====== Hero 头部 ====== -->
      <header class="archive-hero archive-hero--tinted" th:if="${tag?.spec?.displayName}">
        <div class="archive-hero__inner">
          <nav class="archive-hero__breadcrumb">
            <a th:href="@{/}" th:text="#{common.home}">首页</a>
            <span class="archive-hero__breadcrumb-sep">/</span>
            <a th:href="@{/tags}" th:text="#{common.tags}">标签</a>
            <span class="archive-hero__breadcrumb-sep">/</span>
            <span class="archive-hero__breadcrumb-cur" th:text="${tag?.spec?.displayName}"></span>
          </nav>

          <h1 class="archive-hero__title">
            <span class="archive-hero__kicker">Tag</span>
            <span th:text="${tag?.spec?.displayName}"></span>
          </h1>

          <div class="archive-hero__meta">
            <span class="hero-badge hero-badge--accent">
              <i class="Nug Nug-biaoqian"></i>
              <span th:text="${tag?.spec?.displayName}"></span>
            </span>
            <span class="hero-badge hero-badge--muted">
              <i class="Nug Nug-wenzhang"></i>
              <span th:text="${posts?.total ?: 0}"></span>
              <span th:text="#{unit.posts}">篇文章</span>
            </span>
            <span class="hero-badge hero-badge--muted" th:if="${(posts?.totalPages ?: 0) > 1}">
              <i class="Nug Nug-riqi"></i>
              <span th:text="#{pagination.pageOf(${posts?.page ?: 1}, ${posts?.totalPages ?: 1})}"></span>
            </span>
          </div>
        </div>
      </header>

      <!-- ====== 回退 Header（无显示名时） ====== -->
      <header class="archive-hero archive-hero--minimal" th:unless="${tag?.spec?.displayName}">
        <div class="archive-hero__inner">
          <h1 class="archive-hero__title">
            <span class="archive-hero__kicker">Tag</span>
            <span th:text="#{common.tags}">标签</span>
          </h1>
        </div>
      </header>

      <!-- ====== 主体：文章网格 + 侧边栏 ====== -->
      <div class="archive-body archive-body--sidebar">

        <!-- 文章卡片网格 -->
        <div class="archive-body__main">
          <th:block th:replace="~{modules/post-card-list :: post-card-list(posts=${posts}, emptyTitle=${#messages.msg('post.empty')}, emptyDesc=${#messages.msg('post.emptyByTag')})}"></th:block>
        </div>

        <!-- ====== 侧边栏 ====== -->
        <aside class="archive-sidebar" th:if="${tag?.spec?.displayName}">
          <div class="archive-sidebar__card">
            <div class="archive-sidebar__stat">
              <span class="archive-sidebar__stat-num" th:text="${posts?.total ?: 0}"></span>
              <span class="archive-sidebar__stat-label" th:text="#{unit.posts}">篇文章</span>
            </div>
            <div class="archive-sidebar__stat" th:if="${(posts?.totalPages ?: 0) > 1}">
              <span class="archive-sidebar__stat-num" th:text="${posts?.totalPages ?: 1}"></span>
              <span class="archive-sidebar__stat-label" th:text="#{unit.page}">页</span>
            </div>
          </div>

          <nav class="archive-sidebar__card">
            <h3 class="archive-sidebar__heading" th:text="#{common.quickLinks}">快捷链接</h3>
            <a th:href="@{/tags}" class="archive-sidebar__link">
              <i class="Nug Nug-biaoqian"></i> <span th:text="#{common.allTags}">所有标签</span>
            </a>
            <a th:href="@{/categories}" class="archive-sidebar__link">
              <i class="Nug Nug-biaoqian"></i> <span th:text="#{common.categories}">分类</span>
            </a>
            <a th:href="@{/archives}" class="archive-sidebar__link">
              <i class="Nug Nug-riqi"></i> <span th:text="#{common.archives}">归档</span>
            </a>
          </nav>
        </aside>
      </div>

      <!-- ====== 分页 ====== -->
      <th:block th:replace="~{modules/pagination :: pagination(posts=${posts})}"></th:block>
    </div>
</include>
